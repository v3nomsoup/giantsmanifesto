services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      SITE_URL: http://localhost:3000
      SESSION_SECRET: dev-only-secret
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: contact@giantsmanifesto.org
    volumes:
      - data:/data
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  data:
